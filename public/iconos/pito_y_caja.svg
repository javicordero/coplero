<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Pito y caja de Carnaval de Cádiz</title>
  <desc>Icono vectorial de un pito de Carnaval de Cádiz y una caja de percusión</desc>

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d7a0"/>
      <stop offset="0.55" stop-color="#d5a25c"/>
      <stop offset="1" stop-color="#a96832"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f6"/>
      <stop offset="0.45" stop-color="#a5afb2"/>
      <stop offset="1" stop-color="#465157"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- PITO DE CARNAVAL -->
  <g transform="translate(42 30) rotate(-7 105 210)" filter="url(#shadow)">
    <!-- cuerpo -->
    <rect x="62" y="25" width="86" height="360" rx="17"
          fill="url(#wood)" stroke="#825127" stroke-width="5"/>
    <!-- placa -->
    <rect x="70" y="68" width="70" height="108" rx="13"
          fill="#e5bd7e" stroke="#9a6230" stroke-width="4"/>
    <!-- abertura -->
    <ellipse cx="105" cy="103" rx="25" ry="31"
             fill="#65401f" stroke="#d29a55" stroke-width="5"/>
    <path d="M87 103 Q105 89 123 103 Q105 118 87 103Z"
          fill="#382317" opacity=".72"/>
    <!-- mecanismo metálico -->
    <circle cx="105" cy="160" r="22" fill="url(#metal)"
            stroke="#3e4a4e" stroke-width="4"/>
    <circle cx="105" cy="160" r="9" fill="#c8d0d1"
            stroke="#536065" stroke-width="3"/>
    <path d="M85 157 L55 149 Q48 148 46 154 L46 160
             Q48 166 56 164 L86 160Z"
          fill="url(#metal)" stroke="#465257" stroke-width="3"/>
    <path d="M125 157 L155 149 Q162 148 164 154 L164 160
             Q162 166 154 164 L124 160Z"
          fill="url(#metal)" stroke="#465257" stroke-width="3"/>
    <!-- agujero -->
    <circle cx="105" cy="350" r="8" fill="#75451f"/>
  </g>

  <!-- CAJA DE CARNAVAL -->
  <g transform="translate(238 210)" filter="url(#shadow)">
    <!-- cuerpo de la caja -->
    <path d="M0 35 Q0 10 28 5 L178 5 Q206 10 206 35
             L198 125 Q196 150 174 158 L32 158 Q10 150 8 125Z"
          fill="url(#metal)" stroke="#3d474c" stroke-width="6"/>

    <!-- casco central -->
    <path d="M12 38 L194 38 L187 124 Q185 143 168 148
             L38 148 Q21 143 19 124Z"
          fill="#d8dde0" stroke="#687276" stroke-width="3"/>

    <!-- parches -->
    <ellipse cx="103" cy="34" rx="96" ry="30"
             fill="#fafafa" stroke="#687276" stroke-width="6"/>
    <ellipse cx="103" cy="34" rx="84" ry="22"
             fill="#f7f7f4" stroke="#c4c8c8" stroke-width="2"/>

    <ellipse cx="103" cy="127" rx="91" ry="28"
             fill="none" stroke="#596469" stroke-width="7"/>

    <!-- aros -->
    <path d="M10 55 Q103 78 196 55" fill="none"
          stroke="#858e91" stroke-width="7"/>
    <path d="M9 108 Q103 131 197 108" fill="none"
          stroke="#858e91" stroke-width="7"/>

    <!-- tensores -->
    <g stroke="#515d62" stroke-width="6" stroke-linecap="round">
      <path d="M24 47 L28 119"/>
      <path d="M59 57 L62 135"/>
      <path d="M103 59 L103 143"/>
      <path d="M147 57 L144 135"/>
      <path d="M182 47 L178 119"/>
    </g>

    <!-- tensores y enganches -->
    <g fill="url(#metal)" stroke="#3f4a4e" stroke-width="2">
      <rect x="19" y="70" width="12" height="20" rx="4"/>
      <rect x="54" y="80" width="12" height="20" rx="4"/>
      <rect x="97" y="82" width="12" height="20" rx="4"/>
      <rect x="141" y="80" width="12" height="20" rx="4"/>
      <rect x="176" y="70" width="12" height="20" rx="4"/>
    </g>

    <!-- bordón -->
    <path d="M25 101 Q103 120 181 101" fill="none"
          stroke="#aeb5b7" stroke-width="3"/>

    <!-- baquetas -->
    <g stroke="#c99558" stroke-width="7" stroke-linecap="round">
      <path d="M45 18 L148 -35"/>
      <path d="M73 -8 L174 25"/>
    </g>
    <g fill="#e1b879">
      <circle cx="45" cy="18" r="4"/>
      <circle cx="148" cy="-35" r="4"/>
      <circle cx="73" cy="-8" r="4"/>
      <circle cx="174" cy="25" r="4"/>
    </g>
  </g>
</svg>